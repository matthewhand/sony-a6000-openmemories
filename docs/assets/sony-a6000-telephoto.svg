<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img" aria-label="Sony A6000 mirrorless camera with telescopic telephoto lens">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="45%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="topDeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="barrelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="22%" stop-color="#334155"/>
      <stop offset="65%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="innerTubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="28%" stop-color="#334155"/>
      <stop offset="72%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="rubberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E242D"/>
      <stop offset="50%" stop-color="#0F141B"/>
      <stop offset="100%" stop-color="#090C10"/>
    </linearGradient>
    <linearGradient id="alphaOrange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="glassGlint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Soft ground shadow -->
  <ellipse cx="164" cy="154" rx="126" ry="9" fill="#000000" opacity="0.28"/>

  <!-- ==================== SONY A6000 BODY (LEFT) ==================== -->
  <g id="a6000-body">
    <!-- Rear EVF eyecup protrusion -->
    <rect x="20" y="54" width="12" height="24" rx="3" fill="#0F141B" stroke="#374151" stroke-width="1"/>
    <rect x="23" y="58" width="5" height="16" rx="1.5" fill="#1F2937"/>

    <!-- Multi-interface hotshoe -->
    <rect x="44" y="42" width="24" height="6" rx="1.5" fill="#4B5563" stroke="#64748B" stroke-width="0.75"/>
    <rect x="48" y="40" width="16" height="3" rx="1" fill="#94A3B8"/>

    <!-- Mode dial with knurling -->
    <rect x="73" y="39" width="18" height="9" rx="2" fill="#27313F" stroke="#64748B" stroke-width="0.9"/>
    <g stroke="#94A3B8" stroke-width="0.8" opacity="0.7">
      <line x1="77" y1="40" x2="77" y2="47"/>
      <line x1="80" y1="40" x2="80" y2="47"/>
      <line x1="83" y1="40" x2="83" y2="47"/>
      <line x1="86" y1="40" x2="86" y2="47"/>
    </g>

    <!-- Front angled shutter collar + silver shutter button (pure paths, no pivot transform) -->
    <path d="M95,48 L106,44 L110,48 L96,52 Z" fill="#334155" stroke="#64748B" stroke-width="0.8"/>
    <path d="M98,45.2 L105.5,42.5 C106.8,42 107.6,43.2 106.5,44.2 L99,46.8 C97.7,47.2 97,45.8 98,45.2 Z" fill="#CBD5E1"/>

    <!-- Main flat-top rangefinder body -->
    <rect x="30" y="48" width="84" height="92" rx="7" fill="url(#bodyGrad)" stroke="#4B5563" stroke-width="1.2"/>
    <!-- Flat top deck chamfer highlight -->
    <path d="M36,48.8 L108,48.8 C111,48.8 113,50.8 113,53.5 L113,62 L31,62 L31,53.5 C31,50.8 33,48.8 36,48.8 Z" fill="url(#topDeck)" opacity="0.85"/>
    <line x1="35" y1="50" x2="109" y2="50" stroke="#9CA3AF" stroke-width="0.8" opacity="0.45"/>

    <!-- Rear articulated LCD profile edge -->
    <rect x="28" y="80" width="4" height="50" rx="1.5" fill="#334155" stroke="#475569" stroke-width="0.7"/>

    <!-- Side sculpted ergonomic grip panel -->
    <path d="M38,67 L90,67 C93,67 95,69 95,72 L95,131 C95,134 93,136 90,136 L38,136 C35,136 33,134 33,131 L33,72 C33,69 35,67 38,67 Z" fill="url(#rubberGrad)" stroke="#334155" stroke-width="0.9"/>

    <!-- Strap lug eyelet (top left) -->
    <circle cx="42" cy="58" r="3" fill="#64748B" stroke="#94A3B8" stroke-width="0.8"/>
    <circle cx="42" cy="58" r="1.2" fill="#0F172A"/>

    <!-- Live LAN cyan indicator LED (top right of body deck, well clear of text) -->
    <circle cx="102" cy="57" r="4.8" fill="#22D3EE" opacity="0.25"/>
    <circle cx="102" cy="57" r="2.2" fill="#67E8F9"/>

    <!-- Battery / dummy-battery bottom door seam -->
    <line x1="36" y1="138" x2="108" y2="138" stroke="#475569" stroke-width="1" stroke-dasharray="14 3"/>

    <!-- Crisp a6000 badge -->
    <text x="41" y="88" font-family="monospace" font-size="11.5" font-weight="700" fill="#F1F5F9" letter-spacing="0.4">&#x3B1;6000</text>
    <text x="41" y="102" font-family="monospace" font-size="6.8" fill="#94A3B8" letter-spacing="1.0">E-MOUNT</text>
    <!-- Subtle dummy-power / LAN tag bar -->
    <rect x="41" y="114" width="38" height="2" rx="1" fill="#22D3EE" opacity="0.65"/>

    <!-- E-Mount Bayonet Flange + Signature Alpha Orange Ring -->
    <rect x="114" y="61" width="6" height="68" rx="1.5" fill="#94A3B8"/>
    <rect x="120" y="62.5" width="4.5" height="65" rx="1" fill="url(#alphaOrange)"/>
  </g>

  <!-- ==================== TELESCOPIC TELEPHOTO LENS (RIGHT) ==================== -->
  <g id="telephoto-lens">
    <!-- Stage 1: Lens mount base collar -->
    <rect x="124.5" y="63" width="20" height="64" rx="2" fill="url(#barrelGrad)" stroke="#475569" stroke-width="1"/>
    <circle cx="131" cy="70" r="1.6" fill="#F97316"/>
    <!-- OSS / AF switch pill -->
    <rect x="131" y="88" width="8" height="14" rx="2" fill="#0F172A" stroke="#64748B" stroke-width="0.7"/>
    <rect x="132.5" y="90" width="5" height="5" rx="1" fill="#94A3B8"/>

    <!-- Stage 2: Main wide zoom barrel + ribbed rubber zoom ring -->
    <path d="M144.5,60 L150,57 L206,57 L206,133 L150,133 L144.5,130 Z" fill="url(#barrelGrad)" stroke="#475569" stroke-width="1"/>
    <rect x="155" y="56" width="44" height="78" rx="2" fill="url(#rubberGrad)" stroke="#334155" stroke-width="0.9"/>
    <g stroke="#334155" stroke-width="1.2" opacity="0.85">
      <line x1="160" y1="58" x2="160" y2="132"/>
      <line x1="165" y1="58" x2="165" y2="132"/>
      <line x1="170" y1="58" x2="170" y2="132"/>
      <line x1="175" y1="58" x2="175" y2="132"/>
      <line x1="180" y1="58" x2="180" y2="132"/>
      <line x1="185" y1="58" x2="185" y2="132"/>
      <line x1="190" y1="58" x2="190" y2="132"/>
      <line x1="195" y1="58" x2="195" y2="132"/>
    </g>

    <!-- Focal length ring markings -->
    <rect x="206" y="59" width="22" height="72" fill="url(#barrelGrad)" stroke="#475569" stroke-width="0.9"/>
    <text x="209" y="74" font-family="monospace" font-size="6.5" fill="#CBD5E1">210</text>
    <text x="209" y="91" font-family="monospace" font-size="6.5" fill="#94A3B8">135</text>
    <text x="211" y="108" font-family="monospace" font-size="6.5" fill="#94A3B8">70</text>
    <text x="211" y="123" font-family="monospace" font-size="6.5" fill="#64748B">55</text>
    <line x1="206" y1="95" x2="209" y2="95" stroke="#22D3EE" stroke-width="1.4"/>

    <!-- Stage 3: Extended telescopic inner zoom tube -->
    <rect x="228" y="64" width="38" height="62" rx="1.5" fill="url(#innerTubeGrad)" stroke="#64748B" stroke-width="1"/>
    <line x1="229" y1="71" x2="265" y2="71" stroke="#94A3B8" stroke-width="1.3" opacity="0.4"/>
    <!-- Fine manual focus ring near tip -->
    <rect x="244" y="63" width="16" height="64" rx="1.5" fill="url(#rubberGrad)" stroke="#475569" stroke-width="0.8"/>
    <g stroke="#475569" stroke-width="0.9" opacity="0.8">
      <line x1="247" y1="65" x2="247" y2="125"/>
      <line x1="250" y1="65" x2="250" y2="125"/>
      <line x1="253" y1="65" x2="253" y2="125"/>
      <line x1="256" y1="65" x2="256" y2="125"/>
    </g>

    <!-- Stage 4: Telephoto lens hood + curved multi-coated front glass -->
    <path d="M266,61 L292,55 C295,54.5 297,56.5 297,59.5 L297,130.5 C297,133.5 295,135.5 292,135 L266,129 Z" fill="url(#barrelGrad)" stroke="#64748B" stroke-width="1.1"/>
    <ellipse cx="295" cy="95" rx="6" ry="37" fill="#090D14" stroke="#475569" stroke-width="1"/>
    <path d="M294,63 C299,76 299,114 294,127 C291,114 291,76 294,63 Z" fill="url(#glassGlint)"/>
    <path d="M293.5,69 C296.5,77 296.5,87 295,93" fill="none" stroke="#E0F2FE" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
